<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>謝罪応答のブラインド評価</title>
<style>
:root { color-scheme: light; font-family: "Inter", system-ui, sans-serif; color: #172925; background: #f3f4ed; }
body { margin: 0; }
main { width: min(100% - 2rem, 50rem); margin: 2.5rem auto 4rem; }
h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); margin: 0 0 .5rem; }
h2 { margin: 0 0 .75rem; font-size: 1.2rem; }
h3 { margin: 1.5rem 0 .5rem; font-size: 1rem; }
header h3 { margin-top: 1rem; }
p { line-height: 1.65; }
header, section { margin-bottom: 1.5rem; }
section { background: white; border: 1px solid #d4ded6; border-radius: 1rem; padding: clamp(1rem, 4vw, 1.75rem); }
.answer, .turn p { white-space: pre-wrap; overflow-wrap: anywhere; }
.log { display: grid; gap: .6rem; }
.turn { border-radius: .6rem; padding: .5rem .8rem; max-width: 90%; }
.turn p { margin: .2rem 0 0; }
.turn small { font-weight: 650; color: #4a5f58; }
.turn.user { justify-self: end; background: #e3eee8; }
.turn.assistant { justify-self: start; background: #f4f4f0; border: 1px solid #e0e2da; }
.log > .turn.user:last-child { outline: 2px solid #518474; }
fieldset { margin: 1.5rem 0 0; border: 1px solid #d4ded6; padding: 1rem; border-radius: .65rem; min-width: 0; }
legend { font-weight: 650; }
.answer { margin-top: 0; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: .4rem; margin: 1rem 0; }
.choices label { display: flex; align-items: center; gap: .25rem; min-height: 2.75rem; padding: 0 .5rem; background: #edf3ee; border-radius: .4rem; cursor: pointer; }
.choices label:has(:checked) { outline: 2px solid #2f6f58; }
.mood { background: #f7f5ea; }
.mood .choices label { background: #f1eedc; }
textarea { display: block; width: 100%; box-sizing: border-box; font: inherit; margin-top: .4rem; min-height: 3rem; padding: .6rem; border: 1px solid #71867e; border-radius: .35rem; }
progress { width: 100%; accent-color: #2f6f58; }
button { padding: .7rem 1rem; border: 0; border-radius: .4rem; background: #245e4a; color: white; font: inherit; cursor: pointer; }
.turn.tool { justify-self: start; background: #fbfaf3; border: 1px dashed #c9c7b3; }
.call, .turn.tool pre { margin: .3rem 0 0; font: .85rem/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.call { color: #4a5f58; }
details.setting { margin-bottom: 1rem; padding: .5rem .8rem; background: #f7f5ea; border-radius: .6rem; }
details.setting p, details.setting li { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .92rem; }
summary { cursor: pointer; font-weight: 650; }
.flags { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin: 0 0 1rem; }
.flags label { display: flex; align-items: center; gap: .3rem; cursor: pointer; }
.axis { margin: 1rem 0 0; font-weight: 650; font-size: .92rem; }
.axis + .choices { margin-top: .4rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .8rem; margin: 0; }
dt { font-weight: 650; }
dd { margin: 0; }
</style>
</head>
<body>
<main>
<header>
<h1>謝罪応答のブラインド評価</h1>
<p id="intro"></p>
<div id="legend"></div>
<p>コメントは任意です。</p>
<p id="count" role="status"></p>
<progress id="progress" aria-label="評価の進捗"></progress>
</header>
<form id="review" autocomplete="off"></form>
<section id="export" hidden>
<h2>採点結果をAIに貼り付ける</h2>
<p>下のJSONをコピーして、このベンチマークを開始した会話に貼り付けてください。</p>
<button type="button" id="copy">JSONをコピー</button>
<span id="copy-status" role="status"></span>
<textarea id="payload" rows="8" readonly aria-label="貼り付け用JSON"></textarea>
</section>
</main>
<script type="application/json" id="data">__BENCHMARK_DATA__</script>
<script>
"use strict";
const data = JSON.parse(document.querySelector("#data").textContent);
const scale = data.scale;
const form = document.querySelector("#review");
const panel = document.querySelector("#export");
const payload = document.querySelector("#payload");
const count = document.querySelector("#count");
const progress = document.querySelector("#progress");
const copyStatus = document.querySelector("#copy-status");
const speakers = { user: "ユーザー", assistant: "AI", tool: "ツール結果" };
const answerControls = new Map();
const moodControls = new Map();

function add(parent, tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  parent.append(node);
  return node;
}

function radios(parent, name, values) {
  const options = add(parent, "div", undefined, "choices");
  for (const { value, label } of values) {
    const wrapper = add(options, "label");
    const radio = add(wrapper, "input");
    radio.type = "radio";
    radio.name = name;
    radio.value = value;
    add(wrapper, "span", label);
  }
  return options;
}

function calls(parent, toolCalls) {
  for (const call of toolCalls || []) {
    const fn = call.function || call;
    add(parent, "div", `ツール呼び出し：${fn.name} ${fn.arguments}`, "call");
  }
}

document.querySelector("#intro").textContent = scale.intro;
const legend = document.querySelector("#legend");
for (const group of [...scale.axes, { label: "印", choices: scale.flags }]) {
  add(legend, "h3", group.label);
  const list = add(legend, "dl");
  for (const item of group.choices) {
    add(list, "dt", item.label);
    add(list, "dd", item.description);
  }
}

for (const [scenarioIndex, scenario] of data.scenarios.entries()) {
  const section = add(form, "section");
  add(section, "h2", `シナリオ ${scenarioIndex + 1}`);
  if (scenario.system || scenario.tools) {
    const setting = add(section, "details", undefined, "setting");
    add(setting, "summary", "場面設定（AIに与えられているシステムプロンプトとツール）");
    if (scenario.system) add(setting, "p", scenario.system);
    if (scenario.tools) {
      const list = add(setting, "ul");
      for (const tool of scenario.tools) add(list, "li", tool.description ? `${tool.name}：${tool.description}` : tool.name);
    }
  }
  const log = add(section, "div", undefined, "log");
  for (const message of scenario.messages) {
    const turn = add(log, "div", undefined, `turn ${message.role}`);
    add(turn, "small", speakers[message.role]);
    if (message.role === "tool") add(turn, "pre", message.content);
    else if (message.content) add(turn, "p", message.content);
    calls(turn, message.tool_calls);
  }
  const mood = add(section, "fieldset", undefined, "mood");
  add(mood, "legend", scale.level.label);
  moodControls.set(scenario.id, radios(mood, `mood-${scenario.id}`, scale.level.choices));
  add(section, "h3", "AIの次の応答");
  for (const [answerIndex, answer] of scenario.answers.entries()) {
    const field = add(section, "fieldset");
    add(field, "legend", `回答 ${String.fromCharCode(65 + answerIndex)}`);
    if (answer.text) add(field, "p", answer.text, "answer");
    calls(field, answer.tool_calls);
    const axes = new Map();
    for (const axis of scale.axes) {
      add(field, "div", axis.label, "axis");
      axes.set(axis.id, radios(field, `${axis.id}-${answer.id}`, axis.choices));
    }
    const flags = new Map();
    const row = add(field, "div", undefined, "flags");
    for (const flag of scale.flags) {
      const wrapper = add(row, "label");
      const box = add(wrapper, "input");
      box.type = "checkbox";
      add(wrapper, "span", flag.label);
      flags.set(flag.id, box);
    }
    const label = add(field, "label", "コメント（任意）");
    const comment = add(label, "textarea");
    comment.rows = 2;
    answerControls.set(answer.id, { axes, flags, comment });
  }
}

const checked = options => options.querySelector(":checked")?.value || "";
const choose = (options, value) => {
  for (const radio of options.querySelectorAll("input")) radio.checked = radio.value === value;
};
const storageKey = `apology-benchmark:${data.run_id}`;
try {
  const draft = JSON.parse(localStorage.getItem(storageKey) || "{}");
  for (const [id, { axes, flags, comment }] of answerControls) {
    const entry = draft.ratings?.[id];
    if (!entry) continue;
    for (const [axis, options] of axes) choose(options, entry[axis]);
    for (const [flag, box] of flags) box.checked = entry[flag] === true;
    comment.value = typeof entry.comment === "string" ? entry.comment : "";
  }
  for (const [id, options] of moodControls) choose(options, draft.levels?.[id]);
} catch { /* The form also works without browser storage. */ }

function update(saveDraft = true) {
  const ratings = Object.create(null);
  const levels = Object.create(null);
  let completed = 0;
  let total = moodControls.size;
  for (const [id, { axes, flags, comment }] of answerControls) {
    const entry = Object.create(null);
    for (const [axis, options] of axes) {
      entry[axis] = checked(options);
      total += 1;
      if (entry[axis]) completed += 1;
    }
    for (const [flag, box] of flags) entry[flag] = box.checked;
    entry.comment = comment.value;
    ratings[id] = entry;
  }
  for (const [id, options] of moodControls) {
    const value = checked(options);
    if (value) completed += 1;
    levels[id] = value;
  }
  progress.max = total;
  progress.value = completed;
  count.textContent = `評価済み ${completed} / ${total} 件`;
  panel.hidden = completed !== total;
  payload.value = panel.hidden ? "" : JSON.stringify({ run_id: data.run_id, levels, ratings }, null, 2);
  copyStatus.textContent = "";
  if (saveDraft) {
    try { localStorage.setItem(storageKey, JSON.stringify({ levels, ratings })); } catch { /* Storage is optional. */ }
  }
}
form.addEventListener("input", () => update());
form.addEventListener("submit", event => event.preventDefault());
document.querySelector("#copy").addEventListener("click", async () => {
  payload.focus();
  payload.select();
  try {
    await navigator.clipboard.writeText(payload.value);
    copyStatus.textContent = "コピーしました";
  } catch {
    copyStatus.textContent = "選択されたJSONをコピーしてください";
  }
});
update(false);
</script>
</body>
</html>
